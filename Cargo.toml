[package]
name = "may-redis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/microscaler/may_redis"
description = "A coroutine-based Redis client for the may runtime"

[dependencies]
bytes = "1.7"
bollard = { version = "0.20", optional = true, features = ["ssl", "chrono"] }
futures = { version = "0.3", optional = true }
itoa = "1.0"
log = "0.4"
# The crates.io requirement, so a dependent's `[patch.crates-io] may = ...` governs it and the
# process has ONE may runtime. A git source here (it was `branch = "master"`) is a different crate
# to cargo from a dependent's patched `may`: the process then runs two may schedulers, and this
# crate's connection loops run on the second one - with may's default coroutine stack, whatever
# the application configured on its own scheduler. Builds of this repository use the fork through
# the [patch.crates-io] below (it adds `spsc::Receiver::recv_with_timeout`); dependents must patch
# `may` to a revision of github.com/microscaler/may that has it.
may = { version = "0.3", default-features = false, features = ["io_timeout"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
socket2 = "0.5"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros"] }
webpki-roots = { version = "0.25", optional = true }

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
cluster = []
test = ["dep:bollard", "dep:futures", "dep:tokio"]

[dev-dependencies]
fastrand = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
# Per-function: deny any function exceeding the default 100-line limit
too_many_lines = "deny"
# Per-file: deny any single file exceeding 350 lines (project rule).
# NOTE: Clippy has no built-in lint for file-level line count, so this is
# enforced via CI (`scripts/check-file-lengths.sh` or equivalent).
# See docs/PRD-file-breakdown-audit.md for the current file-length audit.
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
# JSF-AV Rule 208: No panics in dispatch
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# This repository's own builds: the may fork (see the `may` dependency above).
[patch.crates-io]
may = { git = "https://github.com/microscaler/may.git", rev = "2156e046291dfd568797f10630ffbc74694d33aa" }
